# kitty 基础设置；由 kitty.conf 加载。

# 字体
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# 拉丁字符使用 Fira Code，指定的中日韩字符范围使用思源黑体。
symbol_map U+2E80-U+2EFF,U+2F00-U+2FDF,U+3000-U+303F,U+3040-U+30FF,U+3100-U+312F,U+31A0-U+31BF,U+31C0-U+31EF,U+3200-U+32FF,U+3300-U+33FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FE30-U+FE4F,U+FF00-U+FFEF Source Han Sans CN

# 窗口与光标
window_padding_width 25
cursor_trail 1

# 提示音
enable_audio_bell no

# 基础主题；kitty.conf 最后加载的 Noctalia 配色具有更高优先级。
include theme.conf

# 可选窗口设置
# background_opacity 0.60
# hide_window_decorations yes
# confirm_os_window_close 0
