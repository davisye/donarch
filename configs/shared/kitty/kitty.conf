# kitty 主配置；字体、窗口、光标和基础配色见 bdsettings.conf。
# 配置参考：https://sw.kovidgoyal.net/kitty/conf/
include bdsettings.conf

# Shell
shell /usr/bin/fish

# 标签栏
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# 快捷键
# 保留 Shift+Enter 原始按键，供 Codex CLI 等多行输入 TUI 使用。
# 在当前目录新建标签页（默认在主目录新建）：
# map ctrl+shift+t new_tab_with_cwd

# 可选：降低延迟，但会增加能耗。
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# 可选：关闭 Wayland 输入法支持（会影响中文输入）。
# wayland_enable_ime no

# Noctalia 生成的颜色覆盖 bdsettings.conf 中加载的基础主题。
include themes/noctalia.conf
